[project]
name = "glam"
version = "0.1.0"
description = "GLAM - Predicting progression rate in highly myopic glaucomatous patients via deep learning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Claude API
    "anthropic>=0.49.0",
    # Deep Learning
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "lightning>=2.4.0",
    # Data Management
    "polars>=1.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    # Config Management
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    # Experiment Tracking
    "wandb>=0.18.0",
    # Interpretability & Optimization
    "shap>=0.46.0",
    "optuna>=3.6.0",
    # Medical / Survival Analysis
    "lifelines>=0.29.0",
    # Visualization
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.1.0",
]

[tool.uv]
# shap pulls in llvmlite/numba versions that only support Python <3.10; override for Python 3.11+
override-dependencies = [
    "llvmlite>=0.40.0",
    "numba>=0.57.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"
